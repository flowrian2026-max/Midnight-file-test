<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scent Scribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1123; --plum:#1F1823; --ink:#0C080D; --peri:#8387C3; --lav:#7A6284; --pearl:#ECE9F4; --mist:#A9A6CC;
  --tint:#8387C3; --bh:min(66vh,128vw);
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{background:var(--ink);color:var(--pearl);color-scheme:dark}
body{height:520vh;font-family:var(--sans);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,var(--plum),var(--navy) 58%,var(--ink))}
canvas#fx,video#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video#vid{opacity:0;transition:opacity 1.2s;mix-blend-mode:screen}
video#vid.on{opacity:.55}
.spot{position:absolute;inset:0;background:radial-gradient(38vmax 52vmax at var(--lx,30%) 30%,color-mix(in srgb,var(--tint) 34%,transparent),transparent 70%);mix-blend-mode:screen;pointer-events:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:22vh;background:linear-gradient(to bottom,transparent,rgba(3,4,14,.88) 70%),radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--tint) 22%,transparent),transparent 70%)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 45%,transparent 45%,rgba(2,3,10,.82));pointer-events:none}

.mark{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 22px);left:28px;font:500 1.35rem/1 var(--serif);letter-spacing:.04em}
.mark i{font-weight:300;color:var(--mist)}

.title{position:absolute;z-index:1;left:0;right:0;top:15vh;text-align:center;font:300 clamp(4.2rem,17vw,15rem)/.85 var(--serif);letter-spacing:-.02em;color:color-mix(in srgb,var(--pearl) 88%,var(--tint));white-space:nowrap;will-change:transform,opacity}
.tag{position:absolute;z-index:1;left:0;right:0;top:calc(15vh + clamp(3.6rem,14.5vw,12.5rem));text-align:center;font:italic 300 clamp(1rem,2vw,1.5rem)/1.3 var(--serif);color:var(--mist)}

.bottle{position:absolute;z-index:3;left:50%;bottom:19vh;height:var(--bh);transform-origin:50% 100%;will-change:transform}
.bottle img{display:block;height:100%;width:auto;transition:opacity .45s,filter .45s,transform .45s}
.bottle .refl{position:absolute;top:100%;left:0;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent 38%);mask-image:linear-gradient(to top,#000,transparent 38%);filter:blur(1.5px)}
.bottle::before{content:"";position:absolute;inset:8% -30% -2%;background:radial-gradient(closest-side,color-mix(in srgb,var(--tint) 40%,transparent),transparent);filter:blur(30px);opacity:.7;z-index:-1}
.swap img{opacity:0;filter:blur(14px);transform:translateY(22px)}

.copy{position:absolute;z-index:4;left:57vw;right:5vw;top:50%;transform:translateY(-50%);pointer-events:none;transition:opacity .45s}
.copy.swap{opacity:0}
.panel{position:absolute;left:0;right:0;top:50%;opacity:0;will-change:opacity,transform}
h2{font:300 clamp(2rem,4vw,3.4rem)/1.05 var(--serif);margin-bottom:1.6rem}
.notes{list-style:none;display:grid;gap:1.4rem;max-width:30rem}
.notes small{display:block;font:400 .78rem/1 var(--sans);letter-spacing:.14em;color:var(--mist);margin-bottom:.35rem}
.notes span{font:italic 300 clamp(1.3rem,2.2vw,1.9rem)/1.2 var(--serif)}
blockquote{font:italic 300 clamp(1.6rem,3vw,2.6rem)/1.2 var(--serif);max-width:28rem;margin-bottom:1.8rem;text-indent:-.45em}
dl{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1.4rem;font-size:.92rem;margin-bottom:2rem}
dt{color:var(--mist)}
.cta{pointer-events:auto;display:inline-block;padding:.95rem 1.8rem;border:1px solid color-mix(in srgb,var(--tint) 70%,var(--pearl));border-radius:99px;color:var(--pearl);background:color-mix(in srgb,var(--tint) 18%,transparent);font:400 .95rem var(--sans);cursor:pointer;backdrop-filter:blur(8px);transition:background .3s}
.cta:hover{background:color-mix(in srgb,var(--tint) 42%,transparent)}

nav{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:clamp(.9rem,4vw,3rem);overflow-x:auto}
nav button{background:none;border:0;color:var(--mist);font:italic 400 clamp(1.05rem,2.4vw,1.4rem) var(--serif);padding:.35rem .1rem;cursor:pointer;border-bottom:1px solid transparent;white-space:nowrap;transition:color .3s,border-color .3s}
nav button:hover{color:var(--pearl)}
nav button[aria-current=true]{color:var(--pearl);border-color:var(--tint)}
button:focus-visible{outline:2px solid var(--pearl);outline-offset:4px}
.hint{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);font:italic 300 1rem var(--serif);color:var(--mist);transition:opacity .6s;pointer-events:none}
.admin{position:fixed;z-index:9;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;padding:.5rem .9rem;border:1px dashed var(--mist);border-radius:8px;font-size:.8rem;background:rgba(7,10,31,.7)}

.bottle{cursor:pointer}
.dome{position:absolute;left:50%;bottom:-3%;width:165%;height:121%;transform:translateX(-50%);transform-origin:50% 100%;border-radius:50% 50% 3% 3%/34% 34% 2% 2%;border:1px solid rgba(236,233,244,.38);border-bottom-color:rgba(236,233,244,.6);background:linear-gradient(105deg,rgba(236,233,244,.16),rgba(236,233,244,.02) 28%,transparent 62%,rgba(236,233,244,.09));box-shadow:inset 0 0 40px rgba(236,233,244,.08),0 0 30px color-mix(in srgb,var(--tint) 25%,transparent);transition:transform 1.7s cubic-bezier(.6,0,.15,1),opacity .7s .9s;pointer-events:none}
.dome::before{content:"";position:absolute;left:12%;top:14%;width:5%;height:62%;border-radius:99px;background:linear-gradient(rgba(236,233,244,.5),rgba(236,233,244,.05));filter:blur(1px)}
.dome::after{content:"";position:absolute;left:50%;top:-3.2%;width:7%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);border:1px solid rgba(236,233,244,.5);background:rgba(236,233,244,.12)}
.mist{position:absolute;left:-6%;right:-6%;bottom:-3%;height:34%;background:radial-gradient(50% 60% at 50% 100%,color-mix(in srgb,var(--tint) 45%,#e8b9d6),transparent 72%);filter:blur(10px);opacity:.75;animation:swell 6s ease-in-out infinite alternate;transition:opacity 1s}
@keyframes swell{to{transform:scale(1.06,1.18);opacity:.55}}
.bottle.open .dome{transform:translate(-50%,-150%) rotate(-12deg);opacity:0}
.bottle.open .mist{opacity:0;animation:none}
.detail{position:fixed;z-index:8;left:57vw;right:5vw;top:50%;transform:translateY(-44%);opacity:0;visibility:hidden;transition:opacity .9s,transform .9s,visibility 0s .9s}
body.detail .detail{opacity:1;visibility:visible;transform:translateY(-50%);transition-delay:.3s,.3s,0s}
body.detail{height:100vh;overflow:hidden}
body.detail nav,body.detail .hint{opacity:0;pointer-events:none}
nav{transition:opacity .5s}
.detail .brand{font-size:.8rem;letter-spacing:.14em;color:var(--mist);margin-bottom:.8rem}
.detail h2{font-size:clamp(2.6rem,5vw,4.6rem);margin-bottom:1rem}
.desc{font:italic 300 clamp(1.2rem,2vw,1.6rem)/1.3 var(--serif);color:var(--mist);margin-bottom:1.8rem;max-width:26rem}
.pyr{grid-template-columns:repeat(3,1fr);gap:1.6rem;max-width:34rem;margin-bottom:1.8rem}
.buy{display:flex;align-items:baseline;gap:1.2rem;margin-bottom:1.4rem}.price{font:300 2.2rem var(--serif)}.buy span{color:var(--mist);font-size:.9rem}
.back{background:none;border:0;color:var(--mist);font:400 .9rem var(--sans);cursor:pointer;margin-bottom:2rem;padding:.2rem 0}.back:hover{color:var(--pearl)}
.detail .cta{pointer-events:auto}
:root{--bb:19vh}
.dvid{position:absolute;z-index:4;left:50%;bottom:calc(var(--bb) - var(--bh)*.35);height:calc(var(--bh)*1.67);width:auto;transform-origin:49.5% 79%;transform:translateX(-49.5%);mix-blend-mode:screen;pointer-events:none;opacity:0;transition:opacity .6s;will-change:transform}
body.hasvid .dvid{opacity:1}
.dvid.lift{-webkit-mask-image:linear-gradient(to bottom,transparent 2%,#000 9%);mask-image:linear-gradient(to bottom,transparent 2%,#000 9%)}
body.hasvid .dome{display:none}
.bottle::after{content:"";position:absolute;inset:-4% -45% -8%}
@media (max-width:760px){:root{--bb:27vh}}
@media (max-width:760px){.detail{left:7vw;right:7vw;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(20px)}body.detail .detail{transform:none}.detail h2{font-size:2.4rem;margin-bottom:.5rem}.desc{margin-bottom:1rem;font-size:1.15rem}.pyr{gap:.8rem;margin-bottom:1rem}.pyr span{font-size:1rem}.back{margin-bottom:.8rem}.buy{margin-bottom:.8rem}}
@media (prefers-reduced-motion:reduce){.dome{transition:none}.mist{animation:none}}
@media (max-width:760px){
  .mark{left:18px}
  .bottle{bottom:27vh}
  :root{--bh:min(46vh,100vw)}
  .copy{left:7vw;right:7vw;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:none}
  .panel{top:auto;bottom:0}
  .notes{gap:.8rem}
  blockquote{margin-bottom:1rem}
  dl{margin-bottom:1rem;font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){.bottle img,.copy{transition:none}}
</style>
</head>

  const g=`<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${a}" stop-opacity=".7"/></linearGradient></defs>`;

  const hl='<rect x="52" y="96" width="9" height="150" rx="4" fill="#fff" opacity=".28"/>';

   '<rect x="40" y="76" width="120" height="230" rx="14" fill="url(#g)"/>'+hl,

  const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 330">${g}${cap}${bodies[k]}<rect x="70" y="190" width="60" height="44" rx="3" fill="#f4eee0" opacity=".85"/></svg>`;

/* trim transparent margins so any uploaded photo lands at the same scale and floor line */
function fit(src){return new Promise(res=>{
  const im=new Image();
  im.onload=()=>{try{
    const s=Math.min(1,1400/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
    for(let y=0;y<h;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>10){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<=x0||y1<=y0)return res(src);
    const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
    o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
    res(o.toDataURL("image/png"));
  }catch(e){res(src)}};
  im.onerror=()=>res(src);im.src=src;
})}

const $=id=>document.getElementById(id);
const root=document.documentElement,bottle=$("bottle"),bimg=$("bimg"),rimg=$("rimg"),copy=$("copy"),
  p1=$("p1"),p2=$("p2"),title=$("title"),tag=$("tag"),nav=$("nav"),vid=$("vid"),hint=$("hint");
let cur=0,busy=false;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t*t*(3-2*t);
const win=(p,a,b,c,d)=>ease(clamp((p-a)/(b-a)))*(1-ease(clamp((p-c)/(d-c))));

async function show(i,first){
  if(busy)return;busy=true;cur=i;const f=PERFUMES[i];
  [...nav.children].forEach((b,j)=>b.setAttribute("aria-current",j===i));
  if(!first){bottle.classList.add("swap");copy.classList.add("swap");await new Promise(r=>setTimeout(r,430));}
  const url=await fit(f.img||svgBottle(f.shape,f.c));
  bimg.src=rimg.src=url;
  root.style.setProperty("--tint",f.tint);
  title.textContent=f.name;tag.textContent=f.tag;
  p1.innerHTML=`<h2>${f.name}</h2><ul class="notes">${f.notes.map(n=>`<li><small>${n[0]}</small><span>${n[1]}</span></li>`).join("")}</ul>`;
  p2.innerHTML=`<blockquote>“${f.q}”</blockquote><dl><dt>Concentration</dt><dd>${f.conc}</dd><dt>Size</dt><dd>${f.size}</dd><dt>Family</dt><dd>${f.fam}</dd><dt>Price</dt><dd>${f.price}</dd></dl><button class="cta" type="button">${f.cta}</button>`;
  if(f.video){vid.onerror=()=>vid.classList.remove("on");vid.src=f.video;vid.play().catch(()=>{});vid.classList.add("on")}else{vid.classList.remove("on");vid.removeAttribute("src")}
  bottle.classList.remove("swap");copy.classList.remove("swap");busy=false;
}
PERFUMES.forEach((f,i)=>{const b=document.createElement("button");b.type="button";b.textContent=f.name;b.onclick=()=>i!==cur&&show(i);nav.appendChild(b)});
addEventListener("keydown",e=>{if(mode==="detail"){if(e.key==="Escape")location.hash="";return}if(e.key==="ArrowRight")show((cur+1)%PERFUMES.length);if(e.key==="ArrowLeft")show((cur+PERFUMES.length-1)%PERFUMES.length)});

/* glass dome, vapor burst, product page (route = #fragrance-name) */
const slug=f=>f.name.toLowerCase().replace(/\s+/g,"-"),det=$("detail");
let mode="stage",dk=0,opening=false;
const dv=$("dvid");let hasvid=false;
dv.addEventListener("loadeddata",()=>{hasvid=true;document.body.classList.add("hasvid");dv.currentTime=.001});
dv.addEventListener("error",()=>{hasvid=false;document.body.classList.remove("hasvid")});
function burst(){const r=bottle.getBoundingClientRect(),x=(r.left+r.width/2)/2,y=(r.bottom-r.height*.05)/2;
  for(let i=0;i<54;i++)bursts.push({x:x+(Math.random()-.5)*W*.1,y:y+(Math.random()-.5)*8,vx:(Math.random()-.5)*2.4,vy:-(Math.random()*1.3+.4),r:W*.025,g:.5+Math.random()*.6,l:1+Math.random()*.5})}
function openDome(){if(opening||mode==="detail")return;opening=true;bottle.classList.add("open");
  if(hasvid){if(still){dv.currentTime=dv.duration-.05}else{dv.classList.add("lift");dv.play().catch(()=>{})}
    setTimeout(()=>{location.hash=slug(PERFUMES[cur]);opening=false},still?0:2900);return}
  if(still){location.hash=slug(PERFUMES[cur]);opening=false;return}
  burst();setTimeout(burst,350);setTimeout(()=>{location.hash=slug(PERFUMES[cur]);opening=false},1700)}
function renderDetail(f){
  det.innerHTML=`<button class="back" type="button">← All fragrances</button><p class="brand">${f.brand}</p><h2>${f.name}</h2><p class="desc">${f.q}</p><ul class="notes pyr">${f.notes.map(n=>`<li><small>${n[0]}</small><span>${n[1]}</span></li>`).join("")}</ul><div class="buy"><b class="price">${f.price}</b><span>${f.conc}, ${f.size}</span></div><button class="cta" type="button">${f.cta}</button>`;
  det.querySelector(".back").onclick=()=>{location.hash=""};
  const c=det.querySelector(".cta");c.onclick=()=>{c.textContent="Added to your bag"}}
async function enter(i){if(i!==cur){busy=false;await show(i,true)}
  renderDetail(PERFUMES[i]);bottle.classList.add("open");mode="detail";
  if(hasvid&&dv.paused&&!dv.classList.contains("lift")){dv.classList.add("lift");dv.currentTime=dv.duration-.05}document.body.classList.add("detail");scrollTo(0,0)}
function leave(){mode="stage";document.body.classList.remove("detail");bottle.classList.remove("open");
  if(hasvid){dv.style.opacity=0;setTimeout(()=>{dv.pause();dv.currentTime=.001;dv.classList.remove("lift");dv.style.opacity=""},650)}}
function route(){const i=PERFUMES.findIndex(f=>slug(f)===location.hash.slice(1));
  if(i>=0){if(mode!=="detail"||cur!==i)enter(i)}else if(mode==="detail")leave()}
bottle.onclick=openDome;bottle.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDome()}};

/* admin: open #admin, then drop a transparent bottle image onto the stage */
if(location.hash==="#admin"){
  const a=document.createElement("div");a.className="admin";a.textContent="Admin: drop a bottle image to replace the current fragrance";document.body.appendChild(a);
  const st=$("stage");st.ondragover=e=>e.preventDefault();
  st.ondrop=e=>{e.preventDefault();const fl=e.dataTransfer.files[0];if(!fl)return;
    const r=new FileReader();r.onload=()=>{PERFUMES[cur].img=r.result;busy=false;show(cur,true)};r.readAsDataURL(fl)};
}

/* smoke and floating particles */
const cv=$("fx"),cx=cv.getContext("2d");let W,H,parts=[],bursts=[],still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){W=cv.width=innerWidth>>1;H=cv.height=innerHeight>>1;
  parts=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,s:Math.random()*.25+.05,a:Math.random()*6}))}
size();addEventListener("resize",size);
const clouds=Array.from({length:9},(_,i)=>({o:i*1.7,sx:.08+i*.013,sy:.05+i*.01,r:.28+(i%4)*.07}));
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function frame(t){
  t*=.00018;const c=rgb(getComputedStyle(root).getPropertyValue("--tint").trim()||"#8a5cff");
  cx.clearRect(0,0,W,H);cx.globalCompositeOperation="lighter";
  clouds.forEach(k=>{
    const x=W*(.5+.42*Math.sin(t*k.sx*9+k.o)),y=H*(.55+.3*Math.cos(t*k.sy*9+k.o*1.3)),r=Math.max(W,H)*k.r;
    const g=cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},.13)`);g.addColorStop(.5,`rgba(${c[0]>>1},${c[1]>>1},${c[2]},.05)`);g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=g;cx.fillRect(0,0,W,H)});
  parts.forEach(p=>{p.y-=p.s;p.x+=Math.sin(t*6+p.a)*.15;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
    cx.fillStyle=`rgba(255,240,255,${.25+.35*Math.sin(t*14+p.a)**2})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()});
  bursts.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vx*=.99;b.vy*=.993;b.r+=b.g;b.l-=.006;if(b.l>0){const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`rgba(${(c[0]+240)>>1},${(c[1]+175)>>1},${(c[2]+215)>>1},${.13*Math.min(1,b.l)})`);g.addColorStop(1,"rgba(0,0,0,0)");cx.fillStyle=g;cx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2)}});
  while(bursts.length&&bursts[0].l<=0)bursts.shift();
  if(!still||bursts.length)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* scroll-driven camera and light */
let tp=0,sp=0;
const wide=()=>innerWidth>760;
function tick(){
  const max=document.documentElement.scrollHeight-innerHeight;
  tp=mode==="detail"?.34:(max>0?scrollY/max:0);sp+=(tp-sp)*(still?1:.08);
  const mv=ease(clamp((sp-.14)/.2));
  dk+=((mode==="detail")-dk)*.08;const f=PERFUMES[cur],sc=(1+sp*.32)*f.scale,dx=(wide()?-mv*23:0)+f.x,dy=-sp*5+f.y-dk*(wide()?0:17),rot=Math.sin(sp*3.2)*1.6;
  bottle.style.transform=`translate(calc(-50% + ${dx}vw),${dy}vh) scale(${sc}) rotate(${rot}deg)`;
  dv.style.transform=`translate(calc(-49.5% + ${dx}vw),${dy}vh) scale(${sc}) rotate(${rot}deg)`;
  title.style.transform=`translateY(${-sp*18}vh) scale(${1+sp*.25})`;
  title.style.opacity=1-ease(clamp(sp/.3))*.9;tag.style.opacity=1-ease(clamp(sp/.14));
  document.querySelector(".spot").style.setProperty("--lx",(18+sp*64)+"%");
  const a=win(sp,.2,.3,.54,.64),b=win(sp,.6,.72,1.1,1.2);
  p1.style.opacity=a;p1.style.transform=`translateY(calc(-50% + ${(1-a)*18}px))`;
  p2.style.opacity=b;p2.style.transform=`translateY(calc(-50% + ${(1-b)*18}px))`;
  if(!wide()){p1.style.transform=`translateY(${(1-a)*14}px)`;p2.style.transform=`translateY(${(1-b)*14}px)`}
  p1.style.pointerEvents=a>.5?"auto":"none";
  hint.style.opacity=sp<.03?1:0;
  requestAnimationFrame(tick);
}
show(0,true).then(route);addEventListener("hashchange",route);tick();
</script>
</body>
</html>
