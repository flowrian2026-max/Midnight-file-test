name: Deploy Scent Scribe Showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Entrance.html"
      - "Entrance.mp4"
      - "Showcase.html"
      - "showcase-v2.html"
      - "Scent Scribe, three domes.html"
      - ".github/workflows/showcase-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "showcase-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare standalone showcase
        run: |
          mkdir -p _site
          mkdir -p _site/entrance
          cp Entrance.html _site/entrance/index.html
          cp Entrance.mp4 _site/entrance/Entrance.mp4
          cp Showcase.html _site/index.html
          cp showcase-v2.html _site/showcase-v2.html
          cp "Scent Scribe, three domes.html" "_site/Scent Scribe, three domes.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
